# Include inside the TLS server block, e.g. wss://your-domain.example.
#
# The secret travels in the URL path: access logging is disabled here so
# secrets never land in nginx logs. For defense in depth, also scrub the
# request URI globally (http context) so no other location or the error
# log can leak it:
#
#   map $request_uri $scrubbed_uri {
#       "~^/(fwd|shell/ws)/[^/]+"  "/$1/<redacted>";
#       default                    $request_uri;
#   }
#   log_format scrubbed '$remote_addr - $remote_user [$time_local] '
#                         '"$request_method $scrubbed_uri $server_protocol" ...';
#   access_log /var/log/nginx/access.log scrubbed;
#
# Rate-limit second connections to /fwd/: the protocol is single-client,
# so a second concurrent tunnel is either a bug or a fight over the stream
# id space. Requires in the http context:
#   limit_conn_zone $binary_remote_addr zone=fwd:1m;

location /fwd/ {
    access_log off;
    # Opt-in: single-client guard (requires the limit_conn_zone above).
    # limit_conn fwd 1;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}

# Web terminal page. The secret also travels in /shell/ws/<secret>, so
# access logging stays off. Put authentication (basic auth, mTLS, SSO) in
# front of /shell/ — anyone who loads the page with the secret gets a shell.
location /shell/ {
    access_log off;
    # auth_basic "muse-proxy shell";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}
